[package]
name = "brief"
version = "0.1.3"
edition = "2024"
description = "A keyboard-first mail client for Hyprland"
license = "MIT"
repository = "https://github.com/elyesghazel/brief"

[dependencies]
async-channel = "2.5.0"
base64 = "0.22.1"
chrono = "0.4.45"
dirs = "7.0.0"
form_urlencoded = "1.2.2"
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
html2text = "0.17.4"
imap = { version = "3.0.0-alpha.15", default-features = false }
imap-proto = "0.16"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "hostname", "rustls", "ring", "webpki-roots"] }
mail-parser = "1.0.0"
ring = "0.17.14"
rusqlite = { version = "0.41.1", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }
webpki-roots = "1.0.11"

[target.'cfg(unix)'.dependencies]
webkit6 = { version = "0.6", optional = true }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_System_Console", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[features]
default = ["webkit"]
# HTML mail in the window via WebKitGTK 6. Without it HTML mail shows as text. Unix only; Windows
# always uses WebView2.
webkit = ["dep:webkit6"]

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
