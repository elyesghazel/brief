name: build

on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_dry_run:
        description: Run the release job without publishing; the would-be release is uploaded as artifact release-dry-run
        type: boolean
        default: false

permissions:
  contents: read

# brief's own Google OAuth client, built into the binaries (empty on forks and fork PRs)
env:
  BRIEF_GOOGLE_CLIENT_ID: ${{ secrets.BRIEF_GOOGLE_CLIENT_ID }}
  BRIEF_GOOGLE_CLIENT_SECRET: ${{ secrets.BRIEF_GOOGLE_CLIENT_SECRET }}

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: cargo test --release --locked
      - run: packaging/linux/tarball.sh dist
      - uses: actions/upload-artifact@v7
        with:
          name: brief-linux-x86_64
          path: dist/*.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      # cargo's home next to the checkout, so the cache can hold the registry
      - shell: pwsh
        run: '"CARGO_HOME=$env:RUNNER_WORKSPACE\cargo-home" >> $env:GITHUB_ENV'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            zip
          pacboy: >-
            gtk4:p
            librsvg:p
            adwaita-icon-theme:p
            pkgconf:p
            gcc:p
            rust:p
            ntldd:p
      - uses: actions/cache@v6
        with:
          path: |
            ${{ runner.workspace }}\cargo-home\registry
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-cargo-
      - name: version
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"$' | Select-Object -First 1).Matches[0].Groups[1].Value
          "VERSION=$v" >> $env:GITHUB_ENV
      - run: cargo build --release --locked
      - run: cargo test --release --locked
      - run: packaging/windows/bundle.sh dist/brief
      # brief loads WebView2Loader.dll itself, so it must not be an import: without it brief still starts
      - run: "! objdump -p dist/brief/brief.exe | grep -i 'DLL Name: WebView2Loader'"
      - name: version info and icon
        shell: pwsh
        run: |
          $v = (Get-Item dist\brief\brief.exe).VersionInfo
          $v | Format-List ProductName, ProductVersion, FileVersion, CompanyName, FileDescription | Out-Host
          if ($v.ProductVersion -ne $env:VERSION -or $v.CompanyName -ne "Elyes Ghazel") { throw "brief.exe lacks its version info" }
          Add-Type -AssemblyName System.Drawing
          if (-not [Drawing.Icon]::ExtractAssociatedIcon("$PWD\dist\brief\brief.exe")) { throw "brief.exe has no icon" }
          if (-not (Test-Path dist\brief\share\icons\hicolor\48x48\apps\ch.elyesghazel.brief.png)) { throw "the bundle lacks the app icon" }
      # outside MSYS2, with a bare PATH, so a DLL missing from the folder fails here
      - name: smoke test
        shell: pwsh
        run: |
          $env:PATH = "C:\Windows\system32;C:\Windows"
          $exe = (Resolve-Path dist\brief\brief.exe).Path
          & $exe --version | Out-Host
          $t = Measure-Command { $themes = & $exe themes | Out-String }
          if ($LASTEXITCODE -ne 0 -or -not $themes.Trim()) { throw "brief themes failed" }
          Write-Host $themes
          Write-Host ("cli start: {0:N0} ms" -f $t.TotalMilliseconds)
          # time to the first window: once cold (first run writes the config), once warm
          foreach ($run in "cold", "warm") {
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $p = Start-Process $exe -PassThru -RedirectStandardError "gui-$run.txt"
            while ($p.MainWindowHandle -eq 0 -and -not $p.HasExited -and $sw.ElapsedMilliseconds -lt 30000) {
              Start-Sleep -Milliseconds 10
              $p.Refresh()
            }
            $ms = $sw.ElapsedMilliseconds
            $alive = -not $p.HasExited
            Start-Sleep -Seconds 3
            if ($run -eq "warm") {
              Add-Type -AssemblyName System.Windows.Forms, System.Drawing
              $r = [Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bmp = [Drawing.Bitmap]::new($r.Width, $r.Height)
              [Drawing.Graphics]::FromImage($bmp).CopyFromScreen($r.Location, [Drawing.Point]::Empty, $r.Size)
              $bmp.Save("$PWD\dist\screenshot.png")
            }
            if (-not $p.HasExited) { Stop-Process $p -Force }
            Get-Content "gui-$run.txt" | Out-Host
            if (-not $alive -or $ms -ge 30000) { throw "the window did not come up" }
            Write-Host "window up after $ms ms ($run)"
          }
      # a styled HTML mail in the reader through WebView2, then: Space scrolls it, ? puts the help
      # over it (the view has to hide), Esc brings it back, it follows a resize, Ctrl+= zooms, a
      # double-click selects text and hands the keys back (Ctrl+C copies, G goes to the end), a
      # mailto: link opens the composer; without WebView2Loader.dll the mail shows as text
      - name: html smoke test
        shell: pwsh
        run: |
          $env:PATH = "C:\Windows\system32;C:\Windows"
          $exe = (Resolve-Path dist\brief\brief.exe).Path
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $r = [Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = [Drawing.Bitmap]::new($r.Width, $r.Height)
            [Drawing.Graphics]::FromImage($bmp).CopyFromScreen($r.Location, [Drawing.Point]::Empty, $r.Size)
            $bmp.Save("$PWD\dist\$name.png")
          }
          function Key($k) {
            [Windows.Forms.SendKeys]::SendWait($k)
            Start-Sleep -Seconds 1
          }
          Add-Type @"
          using System; using System.Runtime.InteropServices; using System.Text;
          public static class W {
            public struct RECT { public int Left, Top, Right, Bottom; }
            public delegate bool EnumProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] static extern bool EnumChildWindows(IntPtr p, EnumProc f, IntPtr l);
            [DllImport("user32.dll")] static extern int GetClassName(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll")] static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] static extern void mouse_event(uint f, uint dx, uint dy, uint d, IntPtr e);
            [DllImport("user32.dll")] public static extern bool MoveWindow(IntPtr h, int x, int y, int w, int ht, bool paint);
            // the screen rectangle of the visible WebView2 window inside brief's
            public static RECT View(IntPtr top) {
              RECT found = new RECT();
              EnumChildWindows(top, (h, l) => {
                var s = new StringBuilder(256);
                GetClassName(h, s, 256);
                if (s.ToString().StartsWith("Chrome_WidgetWin") && IsWindowVisible(h)) { GetWindowRect(h, out found); return false; }
                return true;
              }, IntPtr.Zero);
              return found;
            }
            public static void Click(int x, int y, int n) {
              SetCursorPos(x, y);
              for (int i = 0; i < n; i++) {
                mouse_event(2, 0, 0, 0, IntPtr.Zero);
                mouse_event(4, 0, 0, 0, IntPtr.Zero);
              }
            }
          }
          "@
          # an account that never connects, so mailto: links get a composer
          Add-Content "$env:APPDATA\brief\config.toml" "`n[[account]]`nname = `"Test`"`nemail = `"test@example.org`"`nimap = { host = `"127.0.0.1`", port = 9, security = `"none`" }`nsmtp = { host = `"127.0.0.1`", port = 9, security = `"none`" }`npassword_cmd = `"echo x`""
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process $exe -ArgumentList "render", "`"$PWD\tests\fixtures\newsletter.eml`"" -PassThru -RedirectStandardError render.txt
          while (-not (Select-String render.txt -Pattern "webview2" -Quiet -ErrorAction SilentlyContinue) -and -not $p.HasExited -and $sw.ElapsedMilliseconds -lt 60000) {
            Start-Sleep -Milliseconds 50
          }
          Write-Host "webview2 up after $($sw.ElapsedMilliseconds) ms from launch"
          Start-Sleep -Seconds 2
          Shot html
          Key " "
          Shot html-scrolled
          Key "?"
          Shot html-help
          Key "{ESC}"
          Shot html-back
          $p.Refresh()
          $before = [W]::View($p.MainWindowHandle)
          [void][W]::MoveWindow($p.MainWindowHandle, 40, 20, 940, 700, $true)
          Start-Sleep -Seconds 1
          Shot html-resized
          $after = [W]::View($p.MainWindowHandle)
          Write-Host "webview2 window $($before.Left),$($before.Top)-$($before.Right),$($before.Bottom) before the resize, $($after.Left),$($after.Top)-$($after.Right),$($after.Bottom) after"
          if ($after.Right -eq $before.Right -and $after.Bottom -eq $before.Bottom) { throw "the WebView2 window did not follow the resize" }
          Key "^="
          Shot html-zoom
          Key "^0"
          Key "{HOME}"
          $p.Refresh()
          $v = [W]::View($p.MainWindowHandle)
          Write-Host "webview2 window at $($v.Left),$($v.Top) to $($v.Right),$($v.Bottom)"
          if ($v.Right -le $v.Left) { throw "no visible WebView2 window" }
          Set-Clipboard -Value "nothing"
          [W]::Click($v.Left + 200, $v.Top + 149, 2)
          Start-Sleep -Seconds 1
          Key "^c"
          $copied = Get-Clipboard
          Write-Host "Ctrl+C after a double-click copied '$copied'"
          if (-not $copied -or $copied -eq "nothing") { throw "Ctrl+C did not copy the selection" }
          Key "G"
          Shot html-select-end
          Key "{HOME}"
          [W]::Click($v.Left + 120, $v.Top + 45, 1)
          Start-Sleep -Seconds 2
          Shot html-mailto
          if ([W]::View($p.MainWindowHandle).Right -gt 0) { throw "the WebView2 window stayed up over the composer" }
          if (-not $p.HasExited) { Stop-Process $p -Force }
          Get-Content render.txt | Out-Host
          if (-not (Select-String render.txt -Pattern "webview2 .* ready" -Quiet)) { throw "the WebView2 controller was not created" }
          if (-not (Test-Path "$env:LOCALAPPDATA\brief\webview2")) { throw "no WebView2 user data folder" }
          # without the loader DLL the same mail shows as text, with a note
          $alt = "$env:RUNNER_TEMP\brief-noloader"
          Copy-Item dist\brief $alt -Recurse
          Remove-Item "$alt\WebView2Loader.dll"
          $p = Start-Process "$alt\brief.exe" -ArgumentList "render", "`"$PWD\tests\fixtures\newsletter.eml`"" -PassThru -RedirectStandardError render-missing.txt
          Start-Sleep -Seconds 6
          Shot html-missing
          $alive = -not $p.HasExited
          if ($alive) { Stop-Process $p -Force }
          Get-Content render-missing.txt | Out-Host
          if (-not $alive) { throw "brief died without WebView2Loader.dll" }
          if (-not (Select-String render-missing.txt -Pattern "webview2 unavailable" -Quiet)) { throw "no text fallback without WebView2Loader.dll" }
      # Inno Setup: preinstalled on some runner images, else from Chocolatey
      - name: installer
        shell: pwsh
        run: |
          $find = { Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 }
          $iscc = & $find
          if (-not $iscc) {
            choco install innosetup -y --no-progress | Out-Host
            $iscc = & $find
          }
          if (-not $iscc) { throw "no ISCC.exe" }
          Write-Host "using $($iscc.FullName) $($iscc.VersionInfo.FileVersion)"
          & $iscc.FullName /Qp "/DBundle=$PWD\dist\brief" "/DAppVersion=$env:VERSION" "/O$PWD\dist" packaging\windows\brief.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
      # install, run, upgrade in place and uninstall, the way a user would but silent
      - name: installer smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = (Resolve-Path "dist\brief-$env:VERSION-setup-x86_64.exe").Path
          Write-Host ("installer: {0:N1} MB" -f ((Get-Item $setup).Length / 1MB))
          $dir = "$env:LOCALAPPDATA\Programs\brief"
          $exe = "$dir\brief.exe"
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{4822F902-BA9C-45C5-B369-23435B7AD0E7}_is1"
          $menu = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\brief.lnk"
          $desktop = Join-Path ([Environment]::GetFolderPath("Desktop")) "brief.lnk"
          $config = "$env:APPDATA\brief"
          $hadConfig = Test-Path $config
          function Must($ok, $what) { if (-not $ok) { throw $what } }
          function Install($log) {
            $t = Measure-Command {
              $p = Start-Process $setup -Wait -PassThru -ArgumentList "/VERYSILENT", "/CURRENTUSER", "/SUPPRESSMSGBOXES", "/NORESTART", '/MERGETASKS="desktopicon,mailto"', "/LOG=`"$PWD\$log`""
            }
            Write-Host "::group::$log"; Get-Content $log | Out-Host; Write-Host "::endgroup::"
            if ($p.ExitCode -ne 0) { throw "setup exited with $($p.ExitCode)" }
            Write-Host ("{0}: {1:N1} s" -f $log, $t.TotalSeconds)
          }
          function Run {
            $path = $env:PATH
            $env:PATH = "C:\Windows\system32;C:\Windows"
            try {
              $ver = (& $exe --version | Out-String).Trim()
              Must ($LASTEXITCODE -eq 0 -and $ver -eq "brief $env:VERSION") "brief --version printed '$ver'"
              $themes = & $exe themes | Out-String
              Must ($LASTEXITCODE -eq 0 -and $themes.Trim()) "brief themes failed"
              Write-Host "$ver, $(($themes.Trim() -split "`n").Count) themes"
            } finally { $env:PATH = $path }
          }

          Install install.log
          Must (Test-Path $exe) "no $exe"
          Must ((Get-Item $exe).VersionInfo.ProductVersion -eq $env:VERSION) "installed brief.exe has the wrong version"
          Must (Test-Path $menu) "no start menu shortcut"
          Must (Test-Path $desktop) "no desktop shortcut"
          Must ((Get-ItemProperty $key).DisplayVersion -eq $env:VERSION) "no uninstall entry for $env:VERSION"
          Must ((Get-ItemProperty "HKCU:\Software\Classes\brief.mailto\shell\open\command")."(default)" -like "*brief.exe*%1*") "no mailto handler"
          Must ((Get-ItemProperty "HKCU:\Software\RegisteredApplications").brief) "not in RegisteredApplications"
          Run

          # same version again over the top: the upgrade path
          Install upgrade.log
          Must (-not (Test-Path "$dir\unins001.exe")) "the upgrade made a second uninstaller"
          Run

          $uninst = ((Get-ItemProperty $key).UninstallString).Trim('"')
          $t = Measure-Command {
            Start-Process $uninst -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
            # the uninstaller hands over to a copy of itself in %TEMP%: wait for that one too
            $sw = [Diagnostics.Stopwatch]::StartNew()
            while (((Test-Path $exe) -or (Test-Path $key)) -and $sw.ElapsedMilliseconds -lt 60000) { Start-Sleep -Milliseconds 200 }
          }
          Write-Host ("uninstall: {0:N1} s" -f $t.TotalSeconds)
          Must (-not (Test-Path $dir)) "$dir is still there"
          Must (-not (Test-Path $key)) "the uninstall entry is still there"
          Must (-not (Test-Path $menu) -and -not (Test-Path $desktop)) "a shortcut is still there"
          Must (-not (Test-Path "HKCU:\Software\Classes\brief.mailto")) "the mailto handler is still there"
          Must (-not (Get-ItemProperty "HKCU:\Software\RegisteredApplications" -ErrorAction SilentlyContinue).brief) "still in RegisteredApplications"
          if ($hadConfig) { Must (Test-Path $config) "the uninstall deleted the user's config" }
          Write-Host "install, run, upgrade and uninstall ok"
      - uses: actions/upload-artifact@v7
        with:
          name: brief-setup-x86_64
          path: dist/brief-*-setup-x86_64.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: brief-windows-x86_64-portable
          path: dist/brief
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshot
          path: dist/*.png
          if-no-files-found: ignore

  # On a v* tag: a GitHub release. From workflow_dispatch with release_dry_run: the same files and
  # notes as artifact release-dry-run, nothing published.
  release:
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_dry_run)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: brief-*
          path: dl
      - name: assemble
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [[ $GITHUB_REF == refs/tags/* && $GITHUB_REF_NAME != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi
          mkdir release
          cp "dl/brief-setup-x86_64/brief-$version-setup-x86_64.exe" release/
          mv dl/brief-windows-x86_64-portable dl/brief
          (cd dl && zip -qr9 "../release/brief-$version-windows-x86_64-portable.zip" brief)
          cp "dl/brief-linux-x86_64/brief-$version-linux-x86_64.tar.gz" release/
          (cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS)

          prev=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
          {
            echo "## Downloads"
            echo
            echo "- **Windows installer**: \`brief-$version-setup-x86_64.exe\`. Installs for your user, no admin needed."
            echo "- **Windows portable**: \`brief-$version-windows-x86_64-portable.zip\`. Unzip anywhere, run \`brief.exe\`."
            echo "- **Linux x86_64**: \`brief-$version-linux-x86_64.tar.gz\`. Built on Ubuntu 24.04: needs glibc 2.39+, GTK 4.14+ and WebKitGTK 6.0 (Ubuntu 24.04+, Debian 13+, Fedora 40+, Arch). See \`INSTALL.txt\` inside."
            echo "- \`SHA256SUMS\` to check them: \`sha256sum -c SHA256SUMS --ignore-missing\`."
            echo
            echo "The Windows builds are not code-signed, so SmartScreen may warn on the first start: More info, then Run anyway."
            echo
            echo "## Changes${prev:+ since $prev}"
            echo
            git log --no-merges --format='- %s' ${prev:+$prev..}HEAD
          } > notes.md
          cat notes.md
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=; [[ $VERSION == *-* ]] && pre=--prerelease
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag $pre --title "brief $VERSION" --notes-file notes.md
      - name: dry run
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: release-dry-run
          path: |
            release
            notes.md
